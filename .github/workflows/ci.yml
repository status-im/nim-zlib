name: CI
on:
  push:
    branches:
      - master
      - test-minver
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@minver
    with:
      install-command: 'nimble --resolver:minver install -y --depsOnly'
      test-command: |
        env TEST_LANG="c" nimble test
        env TEST_LANG="cpp" nimble test
